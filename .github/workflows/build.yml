name: Build Changed Only

on:
  push:
    branches:
      - "**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packages
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            packages=$(find . -mindepth 2 -maxdepth 2 \
              -name PKGBUILD \
              -printf '%h\n' |
              sed 's|^\./||' |
              jq -R . |
              jq -sc .)
          else
            packages=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" |
              awk -F/ '
                NF >= 2 && $1 !~ /^\./ {
                  print $1
                }
              ' |
              sort -u |
              while read -r pkg; do
                [[ -f "$pkg/PKGBUILD" ]] && echo "$pkg"
              done |
              jq -R . |
              jq -sc .)
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Detected packages: $packages"

  build:
    needs: detect
    if: needs.detect.outputs.packages != '[]'

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
